name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: forecast_test
          POSTGRES_PASSWORD: forecast_ci_only
          POSTGRES_DB: forecast_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forecast_test -d forecast_ci_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: forecast_test
      POSTGRES_PASSWORD: forecast_ci_only
      POSTGRES_DB: forecast_ci_test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src/ tests/

      - name: Initialize isolated database schemas
        run: |
          python - <<'PY'
          from pathlib import Path
          from src.db import get_connection
          with get_connection() as conn:
              conn.execute(Path("sql/init.sql").read_text())
          PY

      - name: Unit and PostgreSQL integration tests
        run: python -m pytest tests/
